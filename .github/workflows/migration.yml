name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup Old Containers
        shell: powershell
        run: |
          docker rm -f mattermost mattermost-mysql mattermost-postgres 2>$null
          docker network prune -f

      - name: Check Migration Status
        id: check_status
        shell: powershell
        run: |
          if (Test-Path "$HOME\.mattermost_migration_completed") {
            Write-Host "Database already migrated. Skipping."
            "already_migrated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Migration required."
            "already_migrated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: powershell
        run: |
          docker compose -f legacy\docker-compose.yml up -d
          Start-Sleep -Seconds 15
          docker exec mattermost-mysql mysqldump -u root -pMM_ROOT_PASSWORD mattermost > backup_${{ github.run_id }}.sql

      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: powershell
        run: |
          docker compose -f $env:COMPOSE_FILE up -d db-postgres
          Start-Sleep -Seconds 10

      - name: Run pgloader (Using Legacy Network)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: powershell
        run: |
          # Find the exact network Docker created for legacy
          $networkName = docker inspect mattermost-mysql -f "{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}"
          Write-Host "Using Network: $networkName"
          
          docker run --rm --network=$networkName mattermost/mattermost-pgloader:latest pgloader `
            --with "include drop" `
            mysql://root:MM_ROOT_PASSWORD@mattermost-mysql/mattermost `
            postgresql://postgres:MM_POSTGRES_PASSWORD@mattermost-postgres/mattermost

      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: powershell
        run: |
          New-Item -ItemType File -Path "$HOME\.mattermost_migration_completed" -Force

      - name: Deploy Upgraded Stack
        shell: powershell
        run: |
          docker stop mattermost 2>$null
          docker rm mattermost 2>$null
          docker compose -f $env:COMPOSE_FILE up -d --build --remove-orphans
          Start-Sleep -Seconds 30

      - name: Run Health Checks & Verify Data
        shell: powershell
        run: |
          $success = $false
          for ($i=1; $i -le 5; $i++) {
              try {
                  $response = Invoke-RestMethod -Uri "http://localhost:8065/api/v4/system/ping" -ErrorAction Stop
                  $success = $true
                  break
              } catch {
                  Start-Sleep -Seconds 20
              }
          }
          if (-not $success) { exit 1 }
